[build-system]
build-backend = "hatchling.build"
requires = [ "babel", "hatchling" ]

[project]
name = "turtle-translations"
version = "0.0.1"
description = "Docstring translations for the Python turtle module"
readme = "README.md"
license = "PSF-2.0"
authors = [ { name = "Stan Ulbrych", email = "stan@python.org" } ]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Software Development :: Localization",
]
urls.Issues = "https://github.com/python/turtle-translations/issues"
urls.Source = "https://github.com/python/turtle-translations"

[tool.hatch]
build.targets.wheel.hooks.custom.path = "scripts/hook.py"
