[build-system]
build-backend = "hatchling.build"
requires = [ "babel", "hatchling" ]

[project]
name = "turtle-translations"
version = "0.0.1"
description = "Docstring translations for the Python turtle module"
readme = "README.md"
license = "PSF-2.0"
authors = [ { name = "Stan Ulbrych", email = "stan@python.org" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.16",
  "Topic :: Education",
  "Topic :: Software Development :: Localization",
]
urls.Issues = "https://github.com/python/turtle-translations/issues"
urls.Source = "https://github.com/python/turtle-translations"

[tool.hatch]
build.targets.wheel.hooks.custom.path = "scripts/hook.py"
build.targets.wheel.only-include = [ "turtle_translations/__init__.py" ]
build.targets.sdist.include = [
  "/LICENSE",
  "/po/*.po",
  "/pyproject.toml",
  "/README.md",
  "/scripts/*.py",
  "/sources",
  "/tests",
  "/turtle_translations/__init__.py",
]

[tool.check-wheel-contents]
# turtle imports the root shim; version-specific dictionaries live in the package.
toplevel = [ "turtle_docstringdict_pl.py", "turtle_translations" ]

[tool.pyproject-fmt]
max_supported_python = "3.16"
