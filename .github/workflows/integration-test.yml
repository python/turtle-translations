name: Integration test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  integration:
    name: Translate, build & install on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [3.13, 3.14, 3.15]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install build dependencies
        run: python -m pip install babel hatchling build

      - name: Create a new translation
        run: |
          python scripts/i18n.py extract
          python scripts/i18n.py init eo

      - name: Translate one docstring
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import i18n

          path = i18n.PO_DIR / "eo.po"
          catalog = i18n.read_catalog(path)
          for message in catalog:
              if "turtle.Turtle.forward" in message.auto_comments:
                  message.string = "Movu la testudon antaŭen."
                  break
          # A nonexistent name to check it is dropped at import.
          catalog.add("Not a real docstring.", "Ne vera dokumentaĵo.",
                      auto_comments=["turtle.Turtle.nonexistent"])
          i18n.write_catalog(catalog, path)
          PY
          python scripts/i18n.py stats

      - name: Build and install the wheel
        run: |
          python -m build --wheel
          python -m pip install dist/*.whl

      - name: Check the translated docstring is used
        working-directory: ${{ runner.temp }}
        run: |
          echo "language = eo" > turtle.cfg
          cat > check.py <<'PY'
          import contextlib
          import io

          # turtle prints errors for names it cannot resolve.
          with contextlib.redirect_stdout(io.StringIO()) as output:
              import turtle
          assert output.getvalue() == ""

          assert turtle.Turtle.forward.__doc__ == "Movu la testudon antaŭen."
          assert turtle.forward.__doc__ == "Movu la testudon antaŭen."
          assert "Move the turtle backward" in turtle.back.__doc__

          import turtle_docstringdict_eo
          assert "Turtle.nonexistent" not in turtle_docstringdict_eo.docsdict
          assert not hasattr(turtle.Turtle, "nonexistent")
          PY
          python check.py
